name: CourtMate CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: FastAPI tests (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate syntax
        run: python -m compileall -q app.py tests
      - name: Run API tests
        run: python -m pytest tests -q
      - name: Exercise real HTTP server (temporary SQLite)
        run: python ../scripts/smoke_http.py

  android:
    name: Android unit tests & debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Configure Java 25 for AGP 9.4
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      # setup-android v3 requests Google's removed SDK `tools` package.
      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK platform
        run: sdkmanager --install 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Run JVM tests and build debug APK
        run: bash ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - name: Check generated APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK (not a release)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: courtmate-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
